<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  /* 1. Base Styles & Smooth Transition */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-color: #f4f4f9; /* Default background */
    color: #333;
    transition: background-color 0.6s ease, color 0.6s ease; /* Smooth transition effect */
}

/* 2. Change Background & Text Colors based on the checked radio button */
html:has(#sunset:checked) body {
    background-color: #ff7e5f;
    color: #fff;
}

html:has(#ocean:checked) body {
    background-color: #00c6ff;
    color: #fff;
}

html:has(#midnight:checked) body {
    background-color: #141e30;
    color: #e0e0e0;
}

/* 3. Card Styling for UI Presentation */
.card {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 400px;
}

.themes {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    justify-content: center;
    cursor: pointer;
}

label {
    cursor: pointer;
    font-weight: bold;
}
  </style>
</head>
<body>
<div class="card">
        <h1>Theme Switcher</h1>
        <p>Select a theme below to change the background smoothly:</p>

        <!-- Theme Selector Options -->
        <div class="themes">
            <label>
                <input type="radio" name="theme" id="default" checked> Default
            </label>
            <label>
                <input type="radio" name="theme" id="sunset"> Sunset
            </label>
            <label>
                <input type="radio" name="theme" id="ocean"> Ocean
            </label>
            <label>
                <input type="radio" name="theme" id="midnight"> Midnight
            </label>
        </div>
    </div>
</body>
</html>
