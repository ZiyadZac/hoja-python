<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>table</title>
</head>
<body>
  <table bgcolor="black" >
    <tr bgcolor="grey">
      <th width="100px">Monday</th>
      <th width="100px">Tuesday</th>
      <th width="100px">Wednesday</th>
      <th width="100px">Thursday</th>
      <th width="100px">Friday</th>
      <th width="100px">Saturday</th>
    </tr>
    <tr bgcolor="lightgrey" align="center">
      <td>9-5</td>
      <td>9-5</td>
      <td>9-5</td>
      <td colspan="2">closed</td>
      <td>closed</td>
    </tr>
  </table>
  <hr>
  <table bgcolor="black">
    <tr bgcolor="grey" align="center">
      <th bgcolor="lightgrey">Monday</th>
      <td width="50px">Math</td>
      <td width="50px">Physics</td>
      <td width="50px">Biology</td>
      <td width="50px">PT</td>
    </tr>
    <tr  bgcolor="grey" align="center">
      <th bgcolor="lightgrey">Tuesday</th>
      <td width="50px">Biology</td>
      <td width="50px">PT</td>
      <td width="50px">Math</td>
      <td width="50px">Physics</td>
    </tr>
    <tr  bgcolor="grey" align="center">
      <th bgcolor="lightgrey">Wednesday</th>
      <td width="50px">Math</td>
      <td width="50px" colspan="2">Physics</td>
      <td width="50px">PT</td>
    </tr>
    <tr bgcolor="grey" align="center">
      <th bgcolor="lightgrey">Thursday</th>
      <td width="50px" colspan="2">Biology</td>
      
      <td width="50px">Math</td>
      <td width="50px">Physics</td>

    </tr>
  </table>
  <hr>
  <iframe src="colour.html" frameborder="10"></iframe>
</body>
</html>
