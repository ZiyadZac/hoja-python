<!DOCTYPE html>
<html>
 <head>
  <title>Button,Button</title>

<style>
  .sub{
    background: rgb(200, 0, 0);
    color: white;
    border: none;
    /*height: 36px;
    width: 105px;*/
    padding-top: 10px; 
    padding-bottom:10px; 
    padding-left: 16px; 
    padding-right: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 5px;
    vertical-align: top;
    transition: background-color 0.15s,
    
    
    
  }
  .sub:hover{
    opacity: 0.8;
  }
  .sub:active{
    opacity: 0.5;
  }
</style>



<style>
  .join{
    color: rgb(52, 52, 244);
    background: white;
    padding-top: 9px; 
    padding-bottom:9px; 
    padding-left: 16px; 
    padding-right: 16px;
    border:rgb(52, 52, 244);
    border-style: solid;
    border-width: 1px;
    border-radius: 5px;
    margin-right: 5px;
    cursor: pointer;
    vertical-align: top;
    transition: background-color 0.75s,
    color 1s;

    
}
.join:hover{
  color: white;
  background-color: rgb(52, 52, 244);
}
.join:active{
  opacity: 0.7;
}
</style>

<style>
  .tweet{
    color: white;
    background: rgb(26, 125, 239);
    height: 36px;
    cursor: pointer;
    border-radius: 18px;
    border: none;
    width: 80px;
    cursor: pointer;
    font-size: medium;
    vertical-align: top;
    transition: box-shadow 0.15s;
   
  }
  .tweet:hover{
     box-shadow: 5px 5px 10px rgba(0,0,0,0.15);

  }
.tweet:active{
  opacity: 0.7;
}
</style>
 </head>
 <body>
  

<button class="sub">
 SUBSCRIBE
</button>

<button class="join">
 JOIN
</button>

<button class="tweet">
  <strong>Tweet</strong>
</button>
 

<br>
<br>
<a href="https://www.youtube.com" target="_blank">
  Link to YT
</a>
 </body>

</html>
