<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button class="S">Amrin</button>
  <hr>
  <div class="one">
    <button>ONE</button>
    <button>TWO</button>
    <button>THREE</button>
  </div>
  <hr>
  <button class="Sha">Shadow</button>
</body>
</html>

<style>
  .S{
    color: black;
    background-color:blue;
    border-style: solid;
    border-color:pink;
    border-width: 100px;
    border-radius: 500px;

    padding-top: 10px; 
    padding-bottom:10px; 
    padding-left: 16px; 
    padding-right: 16px;
    border: none;
    cursor: pointer;
    transition: padding-top 1s,
      padding-bottom 1s,
      padding-left 1s,
      padding-right 1s;

  }
  .S:hover{
    color: rgb(184, 33, 149);
    background-color:black;
    padding-top: 20px; 
    padding-bottom:20px; 
    padding-left: 32px; 
    padding-right: 32px;
    
}
   .one button{
    color: white;
    background-color: green;
    border: none;
    cursor: pointer;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-left: 15px;
    padding-right: 15px;
    margin-left: 10px;
    margin-right: 10px;

    transition: padding 0.15s,
      margin 0.15s;


}
   .one button:hover{
    padding-left: 21px; 
    padding-right: 21px;
    margin-left: 0px;
    margin-right: 0px;
   }


   .Sha{
    color: white;
    background-color: green;
    padding-top: 10px; 
    padding-bottom:10px; 
    padding-left: 16px; 
    padding-right: 16px;
    border: none;
    cursor: pointer;
    box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3)
  }
  .Sha:active{
    margin-top: 2px;
    margin-left: 2px;


  }

</style>
